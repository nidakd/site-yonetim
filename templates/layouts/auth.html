{% extends "base.html" %}
{% block body %}
<main class="min-h-full flex flex-col items-center justify-center px-4 py-10">
  <div class="w-full max-w-md">
    <div class="mb-8 text-center">
      <div class="mx-auto mb-3 grid h-12 w-12 place-items-center rounded-xl bg-brand-600 text-xl font-bold text-white">S</div>
      <h1 class="text-2xl font-bold">{% block heading %}Site Yönetim{% endblock %}</h1>
      <p class="mt-1 text-sm text-muted">{% block subheading %}{% endblock %}</p>
    </div>
    {% include "components/messages.html" %}
    <div class="card"><div class="card-body">{% block card %}{% endblock %}</div></div>
    <div class="mt-6 text-center text-sm text-muted">{% block below %}{% endblock %}</div>
  </div>
</main>
{% endblock %}
