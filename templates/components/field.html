{% load ui %}
<div>
  <label class="label" for="{{ field.id_for_label }}">{{ field.label }}{% if not field.field.required and not field.field.hide_optional %} <span class="font-normal text-muted">(isteğe bağlı)</span>{% endif %}</label>
  {{ field|add_class:"input" }}
  {% if field.help_text %}<div class="help [&_ul]:list-disc [&_ul]:pl-4 [&_li]:mt-0.5">{{ field.help_text }}</div>{% endif %}
  {% for error in field.errors %}<p class="error-text" id="{{ field.auto_id }}_error">{{ error }}</p>{% endfor %}
</div>
