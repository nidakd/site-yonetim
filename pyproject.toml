[project]
name = "site-yonetim"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["node_modules", "staticfiles"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ", "S", "BLE"]
ignore = ["S101", "S105", "S106", "DJ001", "DJ012"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
"*/migrations/*" = ["E501", "I001"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
